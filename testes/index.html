<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes — R.A.M.A.</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/componentes.css">
<link rel="stylesheet" href="../css/layout.css">
<style>
  /* Só esta página tem estilo próprio: ela não faz parte do sistema,
     é ferramenta de quem está consertando. */
  .placar { display: flex; gap: var(--e4); align-items: baseline; flex-wrap: wrap; }
  .placar__numero { font-size: var(--texto-numero); font-weight: 700; line-height: 1; }
  .grupo { margin-top: var(--e4); }
  .grupo__titulo {
    font-weight: 700; letter-spacing: var(--espaco-letra-titulo);
    text-transform: uppercase; color: var(--cor-texto);
    padding-bottom: var(--e1); border-bottom: 1px solid var(--cor-traco-fraca);
  }
  .caso {
    display: grid; grid-template-columns: 3em 1fr; gap: var(--e2);
    padding: 2px var(--e1); align-items: baseline;
  }
  .caso--ok { color: var(--cor-texto-3); }
  .caso--falhou { color: var(--cor-erro); background: rgba(198, 86, 75, 0.08); }
  .caso__marca { font-family: var(--fonte-mini); font-size: var(--texto-mini); font-weight: 700; }
  .caso__detalhe { font-family: var(--fonte-mini); font-size: var(--texto-mini); color: var(--cor-aviso); }
</style>
</head>
<body>

<div class="veu" aria-hidden="true"></div>

<main id="conteudo" class="app-corpo">
  <div class="pagina-topo">
    <div class="pagina-topo__texto">
      <h1 class="t-titulo">Testes</h1>
      <div class="trilha"><span>R.A.M.A.</span><span class="trilha__sep">·</span><span>Motor de dados, ficha e validação</span></div>
    </div>
  </div>

  <section class="r-painel">
    <h2 class="r-painel__titulo">Placar</h2>
    <div id="placar" class="placar">
      <span class="t-fraco">Executando…</span>
    </div>
  </section>

  <section class="r-painel">
    <h2 class="r-painel__titulo">Verificações</h2>
    <div id="saida"></div>
  </section>

  <p class="t-mini">
    Os mesmos casos rodam na linha de comando com
    <code>deno run --allow-read testes/executar.js</code>.
  </p>
</main>

<script src="../js/config.js"></script>
<script src="../js/util.js"></script>
<script src="../js/dados.js"></script>
<script src="../js/habilidades.js"></script>
<script src="../js/ordem/catalogo.js"></script>
<script src="../js/ordem/poderes.js"></script>
<script src="../js/ordem/opcionais.js"></script>
<script src="../js/ordem/inventario.js"></script>
<script src="../js/ordem/progressao.js"></script>
<script src="../js/ordem/biblioteca.js"></script>
<script src="../js/ordem/regras.js"></script>
<script src="../js/ficha.js"></script>
<script src="../js/validacao.js"></script>
<script src="../js/versao.js"></script>
<script src="casos.js"></script>
<script src="navegador.js"></script>

</body>
</html>
